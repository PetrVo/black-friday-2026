      '</tr>').join('') + '</tbody></table>';
  }

  $('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; save(); render(); });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.cat = b.dataset.cat; save(); renderChips(); render();
  });
  $('list').addEventListener('click', e => {
    const b = e.target.closest('.more'); if (!b) return;
    const cell = b.closest('.desc'); const open = cell.classList.toggle('open');
    b.textContent = open ? 'Méně' : 'Celý komentář';
  });
  renderChips(); render();
})();
</script>
</body>
</html>
